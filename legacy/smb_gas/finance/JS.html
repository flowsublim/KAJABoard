<script>
let state = { bootstrap:null, data:null, activeTab:'dashboard', heavyLoaded:false, renderedTabs:{}, periodKey:'', reportStart:'', reportEnd:'', bankStatement:null, bankStatementLoaded:false, bankStatementLoading:false, bankReconMode:'UNMATCHED' }; 
let modalFinance;
let bankReconMatchState = null;
var FIN_AUTH = window.FIN_BOOTSTRAP || {};
var __financeHeartbeatVersion = String(FIN_AUTH.serverVersion || FIN_AUTH.heartbeatVersion || '');
var __financeLoadedOnce = false;
var __financeLoading = false;
var __financeRefreshQueued = false;
var __financeQueuedHeartbeatVersion = '';

function financeEmail(){ return String(FIN_AUTH.email || FIN_AUTH.userEmail || '').trim().toLowerCase(); }
function financePaspor(){ return String(FIN_AUTH.paspor || FIN_AUTH.passport || '').trim(); }

function runGasFinance(fnName, args, onSuccess, onFailure){
  args = Array.isArray(args) ? args.slice() : [];
  args.push(financeEmail(), financePaspor());
  const runner = google.script.run
    .withSuccessHandler(onSuccess || function(){})
    .withFailureHandler(onFailure || function(err){
      toast('❌ Gagal server: ' + ((err && err.message) || err), 'error');
      showStatus((err && err.message) || String(err), true);
    });
  return runner[fnName].apply(runner, args);
}

function hydrateUserFinance(user){
  user = user || {};
  const name = user.name || user.displayName || FIN_AUTH.displayName || FIN_AUTH.email || '';
  const email = user.email || FIN_AUTH.email || '';
  setText('user-email', name || email || 'User');
}

function bukaLinkModul(url){
  if(!url || url === '#') return false;
  try { window.top.location.href = url; }
  catch(e){ window.location.href = url; }
  return false;
}

function financeModalTerbuka(){ return !!document.querySelector('.modal.show'); }

function prosesRefreshFinanceTertunda(){
  if(!__financeRefreshQueued) return;
  if(financeModalTerbuka() || __financeLoading) return;
  __financeRefreshQueued = false;
  if(__financeQueuedHeartbeatVersion) __financeHeartbeatVersion = String(__financeQueuedHeartbeatVersion);
  __financeQueuedHeartbeatVersion = '';
  refreshAll({ silent:true, source:'heartbeat_queued' });
}

function cekHeartbeatFinance(silent){
  if(!financeEmail() || !financePaspor()) return;
  runGasFinance('ERP_globalHeartbeat', [__financeHeartbeatVersion], function(res){
    if(!res || !res.ok){
      if(res && res.shouldLogout && res.portalUrl){
        toast('⚠️ Sesi Finance habis. Kembali ke Portal...', 'warning');
        setTimeout(function(){ bukaLinkModul(res.portalUrl); }, 800);
      }
      return;
    }
    FIN_AUTH.email = res.userEmail || FIN_AUTH.email;
    FIN_AUTH.displayName = res.displayName || FIN_AUTH.displayName;
    FIN_AUTH.paspor = res.paspor || res.passport || FIN_AUTH.paspor;
    FIN_AUTH.passport = res.passport || res.paspor || FIN_AUTH.passport;
    hydrateUserFinance(res.user || { name: res.displayName, email: res.userEmail });
    const serverVersion = String(res.serverVersion || '');
    if(res.shouldRefresh && __financeLoadedOnce){
      if(financeModalTerbuka() || __financeLoading){
        __financeRefreshQueued = true;
        __financeQueuedHeartbeatVersion = serverVersion;
        return;
      }
      if(serverVersion) __financeHeartbeatVersion = serverVersion;
      refreshAll({ silent:true, source:'heartbeat' });
      return;
    }
    if(serverVersion) __financeHeartbeatVersion = serverVersion;
  }, function(err){
    if(!silent) toast('⚠️ Heartbeat Finance gagal: ' + ((err && err.message) || err), 'warning');
  });
}

function startHeartbeatFinance(){
  cekHeartbeatFinance(true);
  setInterval(function(){ cekHeartbeatFinance(true); }, 60000);
  document.addEventListener('hidden.bs.modal', function(){ setTimeout(prosesRefreshFinanceTertunda, 250); });
}

function logoutFinance(){
  const btn = document.getElementById('btn-logout-finance');
  if(btn){ btn.disabled = true; btn.innerText = 'Logout...'; }
  runGasFinance('ERP_globalLogout', [financePaspor()], function(res){
    const url = (res && res.portalUrl) || FIN_AUTH.portalUrl || '';
    toast('✅ Logout berhasil.', 'success');
    setTimeout(function(){ if(url) bukaLinkModul(url); }, 500);
  }, function(err){
    if(btn){ btn.disabled = false; btn.innerText = 'Logout'; }
    toast('❌ Logout gagal: ' + ((err && err.message) || err), 'error');
  });
}

document.addEventListener('DOMContentLoaded', () => {
  const modalEl = document.getElementById('modalFinance');
  if(modalEl) modalFinance = bootstrap.Modal.getOrCreateInstance(modalEl);
  initFinanceModalSubmitGuard();
  initBankReconActionDelegation();
  initJurnalActionDelegation();
  initFinance();
});

function initFinanceModalSubmitGuard(){
  if(window.__finModalSubmitGuardReady) return;
  window.__finModalSubmitGuardReady = true;
  document.addEventListener('submit', function(ev){
    const form = ev.target;
    if(!form || !form.matches || !form.matches('#modalFinance form.finance-modal-form')) return;
    // Pengaman GAS HTML Service: jangan pernah biarkan form popup melakukan navigasi native.
    ev.preventDefault();
  }, true);
}

function initBankReconActionDelegation(){
  if(window.__finBankReconActionReady) return;
  window.__finBankReconActionReady = true;
  document.addEventListener('click', function(ev){
    const btn = ev.target && ev.target.closest ? ev.target.closest('[data-bank-recon-action]') : null;
    if(!btn) return;
    ev.preventDefault();
    ev.stopPropagation();
    const action = btn.getAttribute('data-bank-recon-action') || '';
    const txKey = btn.getAttribute('data-tx-key') || '';
    if(!txKey){ toast('Tx_Key mutasi bank tidak ditemukan. Klik Refresh lalu coba lagi.', 'danger'); return; }
    if(action === 'match' || action === 'detail') bukaModalMatchBank(txKey);
    else if(action === 'unlink') unlinkBankStatement(txKey);
  });
}


function initJurnalActionDelegation(){
  if(window.__finJurnalActionReady) return;
  window.__finJurnalActionReady = true;
  document.addEventListener('click', function(ev){
    const btn = ev.target && ev.target.closest ? ev.target.closest('[data-jurnal-action]') : null;
    if(!btn) return;
    ev.preventDefault();
    ev.stopPropagation();
    if(btn.disabled) return;
    const action = btn.getAttribute('data-jurnal-action') || '';
    const jurnalKey = btn.getAttribute('data-jurnal-key') || '';
    if(!jurnalKey){ toast('Kunci jurnal tidak ditemukan. Refresh data lalu coba lagi.', 'danger'); return; }
    if(action === 'edit') bukaModalEditJurnal(jurnalKey);
    else if(action === 'delete') hapusJurnal(jurnalKey);
  });
}

function initFinance(){
  showStatus('Memuat modul Finance...', false);
  runGasFinance('FIN_getBootstrap', [], res => {
    state.bootstrap = res || {};
    if(res && res.heartbeat && res.heartbeat.version) __financeHeartbeatVersion = String(res.heartbeat.version);
    FIN_AUTH.email = res.email || res.userEmail || FIN_AUTH.email;
    FIN_AUTH.displayName = (res.user && res.user.name) || (res.auth && res.auth.displayName) || FIN_AUTH.displayName;
    FIN_AUTH.paspor = res.paspor || res.passport || FIN_AUTH.paspor;
    FIN_AUTH.passport = res.passport || res.paspor || FIN_AUTH.passport;
    hydrateUserFinance(res.user || res.auth || {});
    renderModuleLinks(res.moduleLinks || []);
    renderCOAFromBootstrap();
    initPeriodFilter();
    refreshAll({ silent:false, source:'init', lite:true });
    startHeartbeatFinance();
  }, err => showStatus((err && err.message) || String(err), true));
}

function renderCOAFromBootstrap(){
  if(!state.data) state.data = {};
  const coa = state.bootstrap?.coa || [];
  if(coa.length && !(state.data.coa || []).length){
    state.data.coa = coa;
  }
}

function refreshAll(opts){
  opts = opts || {};
  if(__financeLoading) return;
  __financeLoading = true;
  const lite = opts.lite !== false;
  if(!opts.silent) showStatus(lite ? 'Memuat ringkasan finance...' : 'Refresh data finance lengkap...', false);
  const payload = Object.assign({ mode: lite ? 'LITE' : 'FULL', sync:false, journalLimit:250, arusKasLimit:250 }, getFinanceFilterPayload());
  runGasFinance('FIN_getDashboardData', [payload], res => {
    __financeLoading = false;
    __financeLoadedOnce = true;
    state.data = Object.assign({}, state.data || {}, res || {});
    state.heavyLoaded = !!(res && res.heavyLoaded);
    state.renderedTabs = {};
  state.bankStatementLoaded = false;
  state.bankStatement = null;
    renderActiveTab();
    showStatus('');
    renderSourceWarnings();
  }, err => {
    __financeLoading = false;
    showStatus((err && err.message) || String(err), true);
  });
}

function normalizeFinanceTab(tab){
  const t = String(tab || 'dashboard').trim();
  const key = t.toLowerCase().replace(/[^a-z0-9]/g, '');
  const map = {
    dashboard: 'dashboard',
    jurnal: 'jurnal',
    piutang: 'piutang',
    hutang: 'hutang',
    aruskas: 'aruskas',
    cashflow: 'aruskas',
    labarugi: 'labarugi',
    laporanlabarugi: 'labarugi',
    neraca: 'neraca',
    cogm: 'cogm',
    cogs: 'cogm',
    coa: 'setting',
    setting: 'setting',
    settings: 'setting',
    coasetting: 'setting'
  };
  return map[key] || t;
}

function pindah(tab){
  tab = normalizeFinanceTab(tab);
  state.activeTab = tab;
  document.querySelectorAll('section[id^="tab-"]').forEach(el => el.classList.add('d-none'));
  document.getElementById('tab-' + tab)?.classList.remove('d-none');
  document.querySelectorAll('.glass-sidebar .nav-link').forEach(a => a.classList.remove('active'));
  document.getElementById('nav-' + tab)?.classList.add('active');
  const m = document.getElementById('mobileTab'); if(m) m.value = tab;
  renderActiveTab();
  ensureFinanceTabData(tab);
}

function renderAll(){
  renderActiveTab();
}

function renderActiveTab(){
  const tab = normalizeFinanceTab(state.activeTab || 'dashboard');
  state.activeTab = tab;
  if(tab === 'dashboard') renderDashboard();
  else if(tab === 'jurnal') renderJurnal();
  else if(tab === 'piutang') renderPiutang();
  else if(tab === 'hutang') renderHutang();
  else if(tab === 'aruskas') renderArusKas();
  else if(tab === 'labarugi') renderLabaRugi();
  else if(tab === 'neraca') renderNeraca();
  else if(tab === 'cogm') renderCogm();
  else if(tab === 'setting' || tab === 'coa') renderCOA();
  state.renderedTabs[tab] = true;
}



function renderSourceWarnings(){ /* clean UI: source warnings are debug-only */ }

function renderDashboard(){
  syncPeriodUiLabel();
  const s = state.data?.summary || {};
  setText('mCash', rupiah(s.cashBalance));
  setText('mPiutang', rupiah(s.totalPiutang));
  setText('mHutang', rupiah(s.totalHutang));
  setText('mDp', rupiah(s.totalDpOpen));
  setText('mRevenue', rupiah(s.revenueMtd));
  setText('mExpense', rupiah(s.expenseMtd));
  setText('mLaba', rupiah(s.labaOperasionalMtd));

  const mpStoreRows = (state.data?.omniFinance?.summary?.marketplaceOutstandingByStoreRows || [])
    .filter(x => num(x.sisaTagihan)>0)
    .sort((a,b)=>num(b.sisaTagihan)-num(a.sisaTagihan))
    .map(x => ({
      invoiceNo: 'Marketplace',
      customer: x.store || x.customer || 'Marketplace',
      source: 'MARKETPLACE',
      sisaTagihan: x.sisaTagihan,
      statusPembayaran: 'BELUM CAIR'
    }));
  const otherPiutang = [...(state.data?.invoices || [])]
    .filter(x => num(x.sisaTagihan)>0 && clean(x.source) !== 'marketplace')
    .sort((a,b)=>num(b.sisaTagihan)-num(a.sisaTagihan))
    .slice(0,5);
  const piutang = mpStoreRows.concat(otherPiutang);
  setHtml('dashPiutang', table(piutang, [
    ['Sumber','source','status'],['Grup/Invoice','invoiceNo'],['Customer/Toko','customer'],['Sisa','sisaTagihan','money'],['Status','statusPembayaran','status']
  ]));

  const kas = (state.data?.arusKas || []).slice(0,8);
  setHtml('dashKas', table(kas, [
    ['Tanggal','tanggal'],['Tipe','tipe','status'],['Ref','noReferensi'],['Kas/Bank','akunKasBank'],['Masuk','masuk','money'],['Keluar','keluar','money']
  ]));
}

function jurnalActionHtml(r){
  const key = escAttr(r.jurnalKey || r.sourceKey || ('JRNROW:' + (r.rowNumber || '')));
  const locked = !!r.isReconciled || !!r.bankTxKey || clean(r.reconStatus) === 'MATCHED';
  const lockAttr = locked ? ' disabled title="Sudah direkonsiliasi. Batalkan link bank terlebih dahulu."' : '';
  return `<div class="d-flex gap-1 flex-wrap">
    <button type="button" class="btn btn-sm btn-outline-primary fw-bold" data-jurnal-action="edit" data-jurnal-key="${key}"${lockAttr}>Edit</button>
    <button type="button" class="btn btn-sm btn-outline-danger fw-bold" data-jurnal-action="delete" data-jurnal-key="${key}"${lockAttr}>Hapus</button>
    ${locked ? '<span class="badge text-bg-success align-self-center">Sudah Recon</span>' : ''}
  </div>`;
}

function renderJurnal(){
  const q = clean(document.getElementById('searchJurnal')?.value);
  let rows = [...(state.data?.jurnal || [])];
  if(q) rows = rows.filter(r => clean([r.tanggal,r.tipeTransaksi,r.noReferensi,r.namaKontak,r.akunDebit,r.akunKredit,r.keterangan,r.operator].join(' ')).includes(q));
  setHtml('jurnalTable', table(rows, [
    ['Tanggal','tanggal'],
    ['Tipe','tipeTransaksi','status'],
    ['Ref','noReferensi'],
    ['Kontak','namaKontak'],
    ['Debit','akunDebit'],
    ['Kredit','akunKredit'],
    ['Nominal','nominal','money'],
    ['Ket','keterangan'],
    ['Aksi','_aksi','html']
  ], r => { r._aksi = jurnalActionHtml(r); return r; }));
}

function renderPiutang(){
  const q = clean(document.getElementById('searchPiutang')?.value);
  let rows = [...(state.data?.invoices || [])];
  if(q) rows = rows.filter(r => clean([r.invoiceNo,r.noPo,r.customer,r.statusPembayaran].join(' ')).includes(q));

  rows = sortAgingRows(rows, 'sisaTagihan', 'tanggal');

  setHtml('piutangTable', table(rows, [
    ['Sumber','source','status'],
    ['Tanggal','tanggal'],
    ['Invoice','invoiceNo'],
    ['PO','noPo'],
    ['Customer','customer'],
    ['Akun Piutang','akunPiutang'],
    ['Nilai Invoice','nilaiInvoice','money'],
    ['DP','dpTerpotong','money'],
    ['Terbayar','terbayar','money'],
    ['Sisa','sisaTagihan','money'],
    ['Status','statusPembayaran','status'],
    ['Umur Piutang','_umur','html']
  ], r => {
    r._umur = agingBadge(r.tanggal, num(r.sisaTagihan) <= 0, 'piutang');
    return r;
  }));
}

function renderHutang(){
  const q = clean(document.getElementById('searchHutang')?.value);
  let rows = [...(state.data?.hutang || [])];
  if(q) rows = rows.filter(r => clean([r.ref,r.vendor,r.source,r.status].join(' ')).includes(q));

  rows = sortAgingRows(rows, 'sisaHutang', 'tanggal');

  setHtml('hutangTable', table(rows, [
    ['Tanggal','tanggal'],
    
    ['Ref','ref'],
    ['Vendor','vendor'],
    ['Total','totalHutang','money'],
    ['Terbayar','terbayar','money'],
    ['Sisa','sisaHutang','money'],
    ['Status','status','status'],
    ['Umur Hutang','_umur','html']
  ], r => {
    r._umur = agingBadge(r.tanggal, num(r.sisaHutang) <= 0, 'hutang');
    return r;
  }));
}

function renderArusKas(){
  ensureBankStatementLoaded();
  const q = clean(document.getElementById('searchKas')?.value);
  let rows = [...(state.data?.arusKas || [])];
  if(q) rows = rows.filter(r => clean([r.tipe,r.noReferensi,r.namaKontak,r.akunKasBank,r.akunLawan,r.keterangan].join(' ')).includes(q));
  rows.sort((a,b) => clean(b.tanggalKey || b.tanggal).localeCompare(clean(a.tanggalKey || a.tanggal)));
  if(!rows.length){
    setHtml('arusKasTable', '<div class="empty-state">Belum ada arus kas yang terbaca. Pastikan transaksi kas/bank dicatat di Data_Jurnal dengan akun Kas/Bank/BCA/Mandiri/BRI/BNI/Giro/Saldo.</div>');
    return;
  }
  setHtml('arusKasTable', table(rows, [
    ['Tanggal','tanggal'],['Tipe','tipe','status'],['Ref','noReferensi'],['Kontak','namaKontak'],['Kas/Bank','akunKasBank'],['Akun Lawan','akunLawan'],['Masuk','masuk','money'],['Keluar','keluar','money'],['Keterangan','keterangan'],['Aksi','_aksi','html']
  ], r => { r._aksi = jurnalActionHtml(r); return r; }));
}



function renderNeraca(){
  if((state.data?.cogmCogs || {}).deferred && !state.heavyLoaded){
    setHtml('neracaBox', `<div class="card p-4 shadow-sm"><div class="fw-bold text-primary">Valuasi stok belum dimuat</div><div class="text-muted small mt-1">Neraca akan dimuat dengan nilai persediaan saat tab ini dibuka.</div></div>`);
    return;
  }
  const n = state.data?.neraca || {};
  setHtml('neracaBox', `
    <div class="row g-4">
      <div class="col-lg-4"><h6 class="fw-bold text-primary">ASET</h6>${table(n.aset || [], [['Akun','akun'],['Saldo','saldo','money']])}<div class="text-end fw-bold mt-2">Total Aset: ${rupiah(n.totalAset)}</div></div>
      <div class="col-lg-4"><h6 class="fw-bold text-danger">LIABILITAS</h6>${table(n.liabilitas || [], [['Akun','akun'],['Saldo','saldo','money']])}<div class="text-end fw-bold mt-2">Total Liabilitas: ${rupiah(n.totalLiabilitas)}</div></div>
      <div class="col-lg-4"><h6 class="fw-bold text-dark">EKUITAS</h6>${table(n.ekuitas || [], [['Akun','akun'],['Saldo','saldo','money']])}<div class="text-end fw-bold mt-2">Total Ekuitas: ${rupiah(n.totalEkuitas)}</div></div>
    </div>
    <div class="alert alert-info small fw-semibold mt-4 mb-0">Neraca as-of memakai Kas/Bank dari jurnal, Piutang konvensional dan marketplace kumulatif sampai tanggal akhir, Saldo Toko dari settlement dikurangi jurnal kredit, serta persediaan dari Gudang/Omni.</div>
  `);
}

function renderCogm(){
  const c = state.data?.cogmCogs || {};
  if(c.deferred && !state.heavyLoaded){
    setHtml('cogmBox', `<div class="card p-4 shadow-sm"><div class="fw-bold text-primary">COGM/COGS belum dimuat</div><div class="text-muted small mt-1">Data berat akan dimuat otomatis saat tab ini dibuka.</div></div>`);
    return;
  }
  const rows = c.rows || [];
  const spk = c.spkRows || [];
  const inventory = c.inventory || {};
  const cogs = c.cogs || {};

  setHtml('cogmBox', `
    <div class="row g-3 mb-4">
      <div class="col-md-3"><div class="card p-3 shadow-sm h-100"><div class="text-muted fw-bold small">Persediaan Bahan</div><h5 class="fw-bolder mb-0">${rupiah(inventory.bahanValue)}</h5><small class="text-muted">Qty ${fmtQty(inventory.bahanQty)}</small></div></div>
      <div class="col-md-3"><div class="card p-3 shadow-sm h-100"><div class="text-muted fw-bold small">WIP / BSG</div><h5 class="fw-bolder mb-0">${rupiah(inventory.wipValue)}</h5><small class="text-muted">Dari SPK belum selesai</small></div></div>
      <div class="col-md-3"><div class="card p-3 shadow-sm h-100"><div class="text-muted fw-bold small">Barang Jadi</div><h5 class="fw-bolder mb-0">${rupiah(inventory.barangJadiValue)}</h5><small class="text-muted">Qty ${fmtQty(inventory.barangJadiQty)}</small></div></div>
      <div class="col-md-3"><div class="card p-3 shadow-sm h-100"><div class="text-muted fw-bold small">COGS Periode Ini</div><h5 class="fw-bolder mb-0 text-danger">${rupiah(cogs.nominal)}</h5><small class="text-muted">Qty ${fmtQty(cogs.qty)} · Final ${rupiah(cogs.finalValue)} · Prov ${rupiah(cogs.provisionalValue)}</small></div></div>
    </div>
    <h6 class="fw-bold text-primary">Ringkasan COGM & COGS</h6>
    ${table(rows, [['Komponen','komponen'],['Qty','qty'],['Nominal','nominal','money']])}
    <h6 class="fw-bold text-primary mt-4">COGM per SPK</h6>
    ${table(spk, [
      ['SPK','spk'],['Jalur','jalur'],['Target','targetQty'],['Output','outputQty'],['Bahan/WIP','wipMaterial','money'],['DP Bahan','dpMaterial','money'],['Upah','upahBorongan','money'],['Overhead','overhead','money'],['Maklun/Jasa','maklunJasa','money'],['Total Cost','totalCost','money'],['COGM/Pcs','cogmPerPcs','money'],['WIP Ending','wipEnding','money']
    ])}
    
  `);
}

function fmtQty(v){
  const n = num(v);
  return Number.isInteger(n) ? n.toLocaleString('id-ID') : n.toLocaleString('id-ID', {maximumFractionDigits: 2});
}

function renderCOA(){
  const rows = coaRows();
  if(!rows.length){
    setHtml('coaTable', `<div class="empty-state">COA belum terbaca. Klik Refresh atau jalankan SETUP_installFinanceModule() untuk memastikan Master_COA tersedia.</div>`);
    return;
  }
  setHtml('coaTable', table(rows, [
    ['Kode','code'],['Nama Akun','name'],['Tipe','type'],['Group','group'],['Normal','normalBalance'],['Posting','isPosting','status'],['Status','status','status'],['Aksi','_aksi','html']
  ], r => {
    r._aksi = `<div class="btn-group btn-group-sm"><button class="btn btn-outline-primary fw-bold" onclick="bukaModalCOA(${Number(r.rowNumber||0)})">Edit</button><button class="btn btn-outline-danger fw-bold" onclick="hapusCOA(${Number(r.rowNumber||0)})">Hapus</button></div>`;
    return r;
  }));
}

/* ================= MODAL INPUT ================= */

function bukaModalEditJurnal(jurnalKey){
  openModal('✏️ Edit Jurnal', '<div class="alert alert-light border mb-0">Memuat detail jurnal...</div>');
  runGasFinance('FIN_getJurnalDetail', [{jurnalKey}], res => {
    const r = (res && res.row) || {};
    const key = r.jurnalKey || jurnalKey;
    if(r.isReconciled){
      openModal('✏️ Edit Jurnal', '<div class="alert alert-warning mb-0">Jurnal sudah direkonsiliasi. Batalkan pencocokan bank terlebih dahulu.</div>');
      return;
    }
    openModal('✏️ Edit Jurnal', `
      <form id="formModalFinance" data-jurnal-key="${escAttr(key)}" onsubmit="submitEditJurnal(event)" class="finance-modal-form">
        <div class="row g-3 align-items-end">
          <div class="col-md-4"><label class="form-label">Tanggal</label><input id="jeTanggal" type="date" class="form-control" value="${escAttr(r.tanggal || today())}" required></div>
          <div class="col-md-4"><label class="form-label">Tipe Transaksi</label><input id="jeTipe" class="form-control" value="${escAttr(r.tipeTransaksi || 'JURNAL_MANUAL')}" required></div>
          <div class="col-md-4"><label class="form-label">No. Referensi</label><input id="jeRef" class="form-control" value="${escAttr(r.noReferensi || '')}"></div>
          <div class="col-md-6"><label class="form-label">Nama Kontak</label><input id="jeKontak" class="form-control" value="${escAttr(r.namaKontak || '')}"></div>

function submitEditJurnal(e, jurnalKey){
  if(e && typeof e.preventDefault === 'function') e.preventDefault();
  const form = e && e.currentTarget ? e.currentTarget : null;
  jurnalKey = String(jurnalKey || (form && form.dataset ? form.dataset.jurnalKey : '') || '').trim();
  if(!jurnalKey){ toast('Kunci jurnal tidak ditemukan. Tutup popup lalu buka ulang.', 'danger'); return false; }
  const payload = {
    jurnalKey,
    tanggal: val('jeTanggal'),
    tipeTransaksi: val('jeTipe'),
    noReferensi: val('jeRef'),
    namaKontak: val('jeKontak'),
    akunDebit: val('jeDebit'),
    akunKredit: val('jeKredit'),
    nominal: val('jeNominal'),
    keterangan: val('jeKet')
  };
  const btn = document.getElementById('btnUpdateJurnal');
  if(btn){ btn.disabled = true; btn.innerText = 'Menyimpan...'; }
  runGasFinance('FIN_updateJurnal', [payload], res => {
    toast((res && res.message) || 'Jurnal diperbarui.', 'success');
    modalFinance.hide();
    refreshAll({silent:true, source:'edit-jurnal'});
  }, err => {
    if(btn){ btn.disabled = false; btn.innerText = 'Simpan Perubahan'; }
    toast((err && err.message) || String(err), 'danger');
  });
}

function hapusJurnal(jurnalKey){
  if(!confirm('Hapus jurnal ini dari riwayat? Data audit tetap disimpan dan laporan akan dihitung ulang.')) return;
  runGasFinance('FIN_deleteJurnal', [{jurnalKey, reason:'Dihapus dari Riwayat Finance'}], res => {
    toast((res && res.message) || 'Jurnal dihapus.', 'success');
    refreshAll({silent:true, source:'delete-jurnal'});

/* ================= BANK RECONCILIATION ================= */

function ensureBankStatementLoaded(){
  if(state.bankStatementLoaded || state.bankStatementLoading) { renderBankStatement(); return; }
  loadBankStatement(false);
}

function loadBankStatement(force){
  if(state.bankStatementLoading) return;
  if(state.bankStatementLoaded && !force){ renderBankStatement(); return; }
  state.bankStatementLoading = true;
  setHtml('bankStatementTable', '<div class="alert alert-light border mb-0">Memuat mutasi bank...</div>');
  const payload = {...getFinanceFilterPayload(), bankReconMode: state.bankReconMode || 'UNMATCHED'};
  runGasFinance('FIN_getBankStatementData', [payload], res => {
    state.bankStatementLoading = false;
    state.bankStatementLoaded = true;
    state.bankStatement = res || { rows: [], summary: {} };
    renderBankStatement();
  }, err => {
    state.bankStatementLoading = false;
    setHtml('bankStatementTable', '<div class="alert alert-danger mb-0">Gagal memuat mutasi bank: '+esc((err && err.message) || String(err))+'</div>');
  });
}

function renderBankStatement(){
  const box = document.getElementById('bankStatementTable');
  if(!box) return;
  const data = state.bankStatement || { rows: [], summary: {} };
  const q = clean(document.getElementById('searchBankStatement')?.value);
  let rows = [...(data.rows || [])];
  if(q) rows = rows.filter(r => clean([r.bankAccount,r.description,r.refNo,r.direction,r.matchStatus,r.sourceFile,r.matchedJurnalKey].join(' ')).includes(q));
  rows.sort((a,b) => clean(b.dateKey || b.statementDate).localeCompare(clean(a.dateKey || a.statementDate)));
  const sum = data.summary || {};
  const modeLabel = (state.bankReconMode || 'UNMATCHED') === 'UNMATCHED_PERIOD' ? 'Belum cocok · periode laporan' : 'Semua mutasi belum cocok';
  setHtml('bankStatementSummary', `${esc(modeLabel)} · Masuk: <b>${rupiah(sum.totalMasuk||0)}</b> · Keluar: <b>${rupiah(sum.totalKeluar||0)}</b> · Baris: <b>${num(sum.totalRows||rows.length)}</b> · Belum match: <b>${num(sum.unmatched||0)}</b>`);
  if(!rows.length){
    setHtml('bankStatementTable', '<div class="empty-state">Tidak ada mutasi bank yang belum dicocokkan pada filter ini.</div>');
    return;
  }
  setHtml('bankStatementTable', table(rows, [
    ['Tanggal','statementDate'],['Bank','bankAccount'],['Keterangan','description'],['Ref','refNo'],['Masuk','masuk','money'],['Keluar','keluar','money'],['Saldo','balance','money'],['Aksi','_aksi','html']
  ], r => {
    const txAttr = escAttr(r.txKey || '');
    r._aksi = `<button type="button" class="btn btn-sm btn-primary fw-bold" data-bank-recon-action="match" data-tx-key="${txAttr}">Cocokkan</button>`;
    return r;
  }));
}

function setBankReconMode(mode){
  state.bankReconMode = mode === 'UNMATCHED_PERIOD' ? 'UNMATCHED_PERIOD' : 'UNMATCHED';
  state.bankStatementLoaded = false;
  loadBankStatement(true);
}

function jsArg(v){ return JSON.stringify(String(v ?? '')); }

function bukaModalMatchBank(txKey){
  bankReconMatchState = null;
  openModal('🔗 Cocokkan Mutasi Bank', '<div class="alert alert-light border mb-0">Mencari transaksi Finance...</div>');
  runGasFinance('FIN_findBankReconCandidates', [{txKey, maxDays:60}], res => {
    const selected = new Set((res && res.selectedKeys) || []);
    bankReconMatchState = { txKey, tx:(res && res.tx) || {}, candidates:(res && res.candidates) || [], selected, search:'' };
    renderBankReconMatchModal();
  }, err => openModal('🔗 Cocokkan Mutasi Bank', `<div class="alert alert-danger mb-0">${esc((err && err.message) || String(err))}</div>`));
}

function filterBankReconCandidates(value){
  if(!bankReconMatchState) return;
  bankReconMatchState.search = clean(value);
  renderBankReconCandidateTable();
}

function renderBankReconCandidateTable(){
  const box = document.getElementById('bankReconCandidateTable');
  const s = bankReconMatchState;
  if(!box || !s) return;
  const q = s.search || '';
  let rows = [...(s.candidates || [])];
  if(q) rows = rows.filter(r => clean([r.tanggal,r.noReferensi,r.namaKontak,r.akunKasBank,r.akunLawan,r.keterangan,r.nominal].join(' ')).includes(q));
  if(!rows.length){ box.innerHTML = '<div class="alert alert-warning mb-0">Tidak ada transaksi Finance yang sesuai akun bank, arah transaksi, dan rentang tanggal.</div>'; return; }
  const body = rows.map(r => {
    const checked = s.selected.has(String(r.jurnalKey)) ? ' checked' : '';
    return `<tr>
      <td class="text-center"><input class="form-check-input" type="checkbox"${checked} data-jurnal-key="${escAttr(r.jurnalKey)}" onchange="toggleBankReconCandidate(this.getAttribute('data-jurnal-key'), this.checked)"></td>
      <td>${esc(r.tanggal || '')}<div class="small text-muted">${num(r.dateDiff || 0)} hari</div></td>
      <td><div class="fw-semibold">${esc(r.noReferensi || '-')}</div><div class="small text-muted">${esc(r.namaKontak || '')}</div></td>
      <td><div>${esc(r.akunLawan || '')}</div><div class="small text-muted">${esc(r.keterangan || '')}</div></td>
      <td class="text-end fw-bold">${rupiah(r.nominal || 0)}</td>
    </tr>`;
  }).join('');
  box.innerHTML = `<div class="table-responsive border rounded" style="max-height:420px;overflow:auto"><table class="table table-sm table-hover align-middle mb-0"><thead class="table-light" style="position:sticky;top:0;z-index:1"><tr><th style="width:42px"></th><th>Tanggal</th><th>Referensi/Kontak</th><th>Akun Lawan/Keterangan</th><th class="text-end">Nominal</th></tr></thead><tbody>${body}</tbody></table></div><div class="small text-muted mt-1">Menampilkan ${num(rows.length)} kandidat.</div>`;
}

function toggleBankReconCandidate(jurnalKey, checked){
  const s = bankReconMatchState;
  if(!s) return;
  if(checked) s.selected.add(String(jurnalKey)); else s.selected.delete(String(jurnalKey));
  updateBankReconSelectionSummary();
}

function bankReconSelectedTotal(){
  const s = bankReconMatchState;
  if(!s) return 0;
  const map = new Map((s.candidates || []).map(r => [String(r.jurnalKey), Number(r.nominal || 0)]));
  let total = 0;
  s.selected.forEach(k => { total += Number(map.get(String(k)) || 0); });
  return total;
}

function updateBankReconSelectionSummary(){
  const s = bankReconMatchState;
  if(!s) return;
  const total = bankReconSelectedTotal();
  const target = Number((s.tx && s.tx.amount) || 0);
  const diff = target - total;
  const exact = s.selected.size > 0 && Math.abs(diff) <= 0.01;
  const box = document.getElementById('bankReconSelectionSummary');
  if(box) box.innerHTML = `<div class="border rounded p-2 ${exact ? 'bg-success-subtle' : 'bg-warning-subtle'}"><div class="small">Dipilih: <b>${num(s.selected.size)} transaksi</b></div><div class="fw-bold">${rupiah(total)}</div><div class="small ${exact ? 'text-success' : 'text-danger'}">Selisih: ${rupiah(diff)}</div></div>`;
  const btn = document.getElementById('btnSaveBankReconMatch');
  if(btn) btn.disabled = !exact;
}

function clearBankReconSelection(){
  if(!bankReconMatchState) return;
  bankReconMatchState.selected.clear();
  renderBankReconCandidateTable();
  updateBankReconSelectionSummary();
}

function submitBankReconMultiMatch(){
  const s = bankReconMatchState;
  if(!s || !s.selected.size){ toast('Pilih transaksi Finance terlebih dahulu.', 'danger'); return; }
  const total = bankReconSelectedTotal();
  const target = Number((s.tx && s.tx.amount) || 0);
  if(Math.abs(target - total) > 0.01){ toast('Total transaksi terpilih harus sama dengan nominal mutasi bank.', 'danger'); return; }
  const btn = document.getElementById('btnSaveBankReconMatch');
  if(btn){ btn.disabled = true; btn.innerText = 'Menyimpan...'; }
  runGasFinance('FIN_linkBankStatementToJurnals', [{ txKey:s.txKey, jurnalKeys:Array.from(s.selected), method:s.selected.size > 1 ? 'MANUAL_MULTI' : 'MANUAL' }], res => {
    toast((res && res.message) || 'Pencocokan tersimpan.', 'success');
    modalFinance.hide();
    bankReconMatchState = null;
    state.bankStatementLoaded = false;
    loadBankStatement(true);
    refreshAll({silent:true, source:'bank-recon-multi-link'});
  }, err => {
    if(btn){ btn.disabled = false; btn.innerText = 'Simpan Pencocokan'; }
    toast((err && err.message) || String(err), 'danger');
  });
}

function submitCreateJurnalFromBank(e, txKey){
  if(e && typeof e.preventDefault === 'function') e.preventDefault();
  const form = e && e.currentTarget ? e.currentTarget : null;
  txKey = String(txKey || (form && form.dataset ? form.dataset.txKey : '') || '').trim();
  if(!txKey){ toast('Tx_Key mutasi bank tidak ditemukan. Tutup popup lalu buka ulang.', 'danger'); return false; }
  const payload = {
    txKey,
    akunLawan: val('bankReconAkunLawan'),
    noReferensi: val('bankReconRef'),
    namaKontak: val('bankReconKontak'),
    keterangan: val('bankReconKet')

  if(!payload.akunLawan){ toast('Akun lawan wajib dipilih.', 'danger'); return; }
  const btn = document.getElementById('btnCreateJurnalFromBank');
  const status = document.getElementById('bankReconCreateStatus');
  if(btn){ btn.disabled = true; btn.innerText = 'Membuat jurnal...'; }
  if(status){ status.className = 'small mb-2 text-primary'; status.textContent = 'Menyimpan jurnal dan menghubungkan mutasi bank...'; }
  runGasFinance('FIN_createJurnalFromBankStatement', [payload], res => {
    toast((res && res.message) || 'Jurnal dibuat dan dilink.', 'success');
    modalFinance.hide();
    bankReconMatchState = null;
    state.bankStatementLoaded = false;
    loadBankStatement(true);
    refreshAll({silent:true, source:'bank-recon-create-journal'});
  }, err => {
    if(btn){ btn.disabled = false; btn.innerText = 'Buat Jurnal & Link'; }
    if(status){ status.className = 'small mb-2 text-danger'; status.textContent = (err && err.message) || String(err); }
    toast((err && err.message) || String(err), 'danger');
  });
}

const FIN_PDFJS_CDN = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
const FIN_PDFJS_WORKER_CDN = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

function FIN_loadPdfJsClient_(){
  if(window.pdfjsLib){
    window.pdfjsLib.GlobalWorkerOptions.workerSrc = FIN_PDFJS_WORKER_CDN;
    return Promise.resolve(window.pdfjsLib);
  }
  if(window.__finPdfJsPromise) return window.__finPdfJsPromise;
  window.__finPdfJsPromise = new Promise((resolve, reject) => {
    const script = document.createElement('script');
    script.src = FIN_PDFJS_CDN;
    script.async = true;
    script.onload = () => {
      if(!window.pdfjsLib){ reject(new Error('PDF.js gagal dimuat.')); return; }
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = FIN_PDFJS_WORKER_CDN;
      resolve(window.pdfjsLib);
    };
    script.onerror = () => reject(new Error('PDF.js tidak dapat dimuat dari CDN.'));
    document.head.appendChild(script);
  });
  return window.__finPdfJsPromise;
}

async function FIN_extractPdfLayoutClient_(file){
  const lib = await FIN_loadPdfJsClient_();
  const buffer = await file.arrayBuffer();
  const pdf = await lib.getDocument({ data:new Uint8Array(buffer) }).promise;
  const pages = [];
  for(let pageNo=1; pageNo<=pdf.numPages; pageNo++){
    const page = await pdf.getPage(pageNo);
    const viewport = page.getViewport({ scale:1 });
    const content = await page.getTextContent({ normalizeWhitespace:true, disableCombineTextItems:false });
    const grouped = [];
    (content.items || []).forEach(item => {
      const text = String(item && item.str || '').replace(/\s+/g, ' ').trim();
      if(!text) return;
      const tr = item.transform || [];
      const x = Number(tr[4] || 0);
      const y = Number(tr[5] || 0);
      const width = Number(item.width || 0);
      const height = Math.abs(Number(item.height || tr[3] || 0));
      let row = null;
      for(let i=grouped.length-1; i>=0 && i>=grouped.length-5; i--){
        if(Math.abs(grouped[i].y - y) <= 2.2){ row = grouped[i]; break; }
      }
      if(!row){ row = { y:y, cells:[] }; grouped.push(row); }
      row.cells.push({ x:Math.round(x*100)/100, w:Math.round(width*100)/100, h:Math.round(height*100)/100, t:text });
    });
    grouped.forEach(row => row.cells.sort((a,b) => a.x-b.x));
    grouped.sort((a,b) => b.y-a.y);
    pages.push({
      page:pageNo,
      width:Math.round(viewport.width*100)/100,
      height:Math.round(viewport.height*100)/100,
      rows:grouped.map(row => ({ y:Math.round(row.y*100)/100, cells:row.cells }))
    });
  }
  return { engine:'PDFJS_LAYOUT_V1', pageCount:pdf.numPages, pages:pages };
}

function FIN_readFileAsDataUrl_(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => resolve((e && e.target && e.target.result) || '');
    reader.onerror = () => reject(new Error('Gagal membaca file PDF.'));
    reader.readAsDataURL(file);
  });
}

async function handleBankStatementFile(input){
  const file = input && input.files && input.files[0];
  const preview = document.getElementById('bankCsvPreview');
  window.__financeBankFilePayload = null;
  if(!file){ if(preview) preview.textContent='Pilih file mutasi bank terlebih dahulu.'; return; }
  const name = file.name || 'bank_statement';
  const lower = name.toLowerCase();
  const isPdf = file.type === 'application/pdf' || lower.endsWith('.pdf');
  const isText = lower.endsWith('.csv') || lower.endsWith('.txt') || /^text\//i.test(file.type || '') || !file.type;
  if(!isPdf && !isText){
    if(preview) preview.innerHTML = '<span class="text-danger">Format belum didukung. Gunakan CSV/TXT atau PDF.</span>';
    return;
  }

  if(isPdf){
    if(preview) preview.innerHTML = `<b>${esc(name)}</b><br>⏳ Membaca struktur PDF...`;
    try {
      const layout = await FIN_extractPdfLayoutClient_(file);
      window.__financeBankFilePayload = {
        fileName:name,
        fileType:'PDF',
        mimeType:file.type || 'application/pdf',
        pdfLayout:layout
      };
      if(preview) preview.innerHTML = `<b>${esc(name)}</b><br>${num(layout.pageCount || 0)} halaman terbaca terstruktur. Saat import, jumlah dan nilai DB/CR akan diverifikasi dengan ringkasan e-statement sebelum disimpan.`;
    } catch(layoutErr){
      try {
        const result = await FIN_readFileAsDataUrl_(file);
        const base64 = String(result).split(',').pop() || '';
        window.__financeBankFilePayload = { fileName:name, fileType:'PDF', mimeType:file.type || 'application/pdf', base64:base64 };
        if(preview) preview.innerHTML = `<b>${esc(name)}</b><br>PDF.js tidak tersedia; sistem akan memakai fallback Google Drive. Import hanya dilanjutkan jika total dan jumlah transaksi lolos verifikasi.`;
      } catch(readErr){
        if(preview) preview.innerHTML = '<span class="text-danger">Gagal membaca PDF: '+esc((readErr && readErr.message) || String(readErr))+'</span>';
      }
    }
    return;
  }

  const reader = new FileReader();
  reader.onload = function(e){
    const text = String((e && e.target && e.target.result) || '');
    window.__financeBankFilePayload = { fileName:name, fileType:'CSV', mimeType:file.type || 'text/plain', csvText:text };
    const lines = text.split(/\r?\n/).filter(Boolean).length;
    if(preview) preview.innerHTML = `<b>${esc(name)}</b><br>${num(lines)} baris terbaca. Siap import ke Bank_Statement.`;
  };
  reader.onerror = function(){ if(preview) preview.innerHTML = '<span class="text-danger">Gagal membaca file.</span>'; };
  reader.readAsText(file);
}

function submitUploadBankStatementFile(e){
  e.preventDefault();
  const fp = window.__financeBankFilePayload || null;
  if(!fp){ toast('File mutasi bank belum terbaca.', 'warning'); return; }
  const payload = {
    ...fp,
    fileName: fp.fileName || 'bank_statement',
    bankAccount: val('bankCsvAccount'),
    importDate: val('bankCsvImportDate'),
    notes: val('bankCsvNotes')
  };
  showStatus('Mengimport mutasi bank...', false);
  runGasFinance('FIN_importBankStatementFile', [payload], res => {
    modalFinance.hide();
    toast((res && res.message) || 'Mutasi bank berhasil diimport.', 'success');
    state.bankStatementLoaded = false;
    loadBankStatement(true);
    refreshAll({ silent:true, source:'bank_statement_import' });
  }, err => showStatus((err && err.message) || String(err), true));
}

function submitUploadBankCsv(e){ submitUploadBankStatementFile(e); }

/* ================= CONTEXT OPTIONS ================= */

function bankFilter(a){
  const key = clean([a.code,a.name,a.group].join(' '));
  return key.includes('KASBANK') || key.includes('KAS') || key.includes('BANK') || key.includes('GIRO') || key.includes('SALDO');
}
function piutangFilter(a){ return clean([a.name,a.group,a.type].join(' ')).includes('PIUTANG'); }
function hutangFilter(a){ return clean([a.name,a.group,a.type].join(' ')).includes('HUTANG'); }
function accountInput(id, label, filterFn, attrs, value){
  const listId = 'list_' + id;
  let rows = coaRows();
  if(filterFn) rows = rows.filter(filterFn);
  const v = value || '';
  return `<label class="form-label">${esc(label)}</label><input id="${escAttr(id)}" class="form-control" list="${escAttr(listId)}" value="${escAttr(v)}" placeholder="Ketik/cari nama akun..." ${attrs||''}>${accountDatalist(listId, rows)}`;
}
function accountDatalist(id, rows){
  rows = rows || [];
  return `<datalist id="${escAttr(id)}">${rows.map(a => `<option value="${escAttr(a.name)}" label="${escAttr((a.code? a.code+' - ' : '') + (a.group ? a.group : ''))}"></option>`).join('')}</datalist>`;
}
function selectOpts(rows, selected){
  const sk = clean(selected);
  return (rows||[]).map(x => `<option value="${escAttr(x)}" ${clean(x)===sk?'selected':''}>${esc(x)}</option>`).join('');
}

function updateSelectOptions(id, html){
  const el = document.getElementById(id);
  if(el) el.innerHTML = html;
}

function syncPoByCustomer(){
  const cust = selectedText('pCustomer');
  updateSelectOptions('pPo', poOptions(cust));
}

function syncInvoiceByCustomer(){
  const cust = selectedText('pCustomer');
  updateSelectOptions('pInvoice', invoiceOptions(cust));
  fillInvoiceAmount();
}

function fillInvoiceAmount(){
  const invoiceNo = val('pInvoice');
  const inv = (state.data?.invoices || []).find(x => clean(x.invoiceNo) === clean(invoiceNo));
  if(inv && document.getElementById('pNominal')) document.getElementById('pNominal').value = num(inv.sisaTagihan);
  if(inv && !val('pRef')) document.getElementById('pRef').value = inv.invoiceNo;
}

function syncHutangByVendor(){
  const vendor = selectedText('kVendor');
  updateSelectOptions('kHutangRef', hutangOptions(vendor));
  fillHutangAmount();
}

function fillHutangAmount(){
  const ref = val('kHutangRef');
  const h = (state.data?.hutang || []).find(x => clean(x.ref) === clean(ref));
  if(h && document.getElementById('kNominal')) document.getElementById('kNominal').value = num(h.sisaHutang);
  if(h && !val('kRef')) document.getElementById('kRef').value = h.ref;
}

function customerOptions(){
  const map = {};
  (state.data?.invoices || []).forEach(x => { if(x.customer) map[x.customer] = true; });
  (state.data?.salesPOs || []).forEach(x => { if(x.customer) map[x.customer] = true; });
  const rows = Object.keys(map).sort();
  return '<option value="">Pilih konsumen...</option>' + rows.map(c => `<option value="${escAttr(c)}">${esc(c)}</option>`).join('');
}

function poOptions(customer){
  let rows = state.data?.salesPOs || [];
  if(customer) rows = rows.filter(x => clean(x.customer) === clean(customer));
  return '<option value="">Pilih PO...</option>' + rows.map(x => `<option value="${escAttr(x.noPo)}">${esc(x.noPo)} — ${esc(x.customer||'')} — ${rupiah(x.total)}</option>`).join('');
}

function invoiceOptions(customer){
  let rows = (state.data?.invoices || []).filter(x => num(x.sisaTagihan) > 0);
  if(customer) rows = rows.filter(x => clean(x.customer) === clean(customer));
  return '<option value="">Pilih invoice...</option>' + rows.map(x => `<option value="${escAttr(x.invoiceNo)}">${esc(x.invoiceNo)} — ${esc(x.customer||'')} — Sisa ${rupiah(x.sisaTagihan)}</option>`).join('');
}

function sortAgingRows(rows, balanceField, dateField){
  return [...(rows || [])].sort((a,b) => {
    const aOpen = num(a[balanceField]) > 0;
    const bOpen = num(b[balanceField]) > 0;
    if(aOpen !== bOpen) return aOpen ? -1 : 1;
    const da = parseClientDate(a[dateField])?.getTime() || 0;
    const db = parseClientDate(b[dateField])?.getTime() || 0;
    return da - db;
  });
}

function agingDays(tanggal){
  const d = parseClientDate(tanggal);
  if(!d) return '';
  const todayDate = new Date();
  todayDate.setHours(0,0,0,0);
  d.setHours(0,0,0,0);
  return Math.max(0, Math.floor((todayDate.getTime() - d.getTime()) / 86400000));
}

function agingBadge(tanggal, closed, type){
  const days = agingDays(tanggal);
  if(days === '') return '<span class="badge bg-secondary">-</span>';
  if(closed) return `<span class="badge bg-success">Lunas · ${days} hari</span>`;
  let cls = 'bg-info text-dark';
  if(days >= 30) cls = 'bg-danger';
  else if(days >= 14) cls = 'bg-warning text-dark';
  return `<span class="badge ${cls}">${days} hari</span>`;
}

function parseClientDate(v){
  if(v instanceof Date && !isNaN(v.getTime())) return new Date(v.getFullYear(), v.getMonth(), v.getDate());
  const s = String(v || '').trim();
  if(!s) return null;

  let m = s.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
  if(m) return new Date(Number(m[1]), Number(m[2])-1, Number(m[3]));

  m = s.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})/);
  if(m) return new Date(Number(m[3]), Number(m[2])-1, Number(m[1]));

  const d = new Date(s);
  return isNaN(d.getTime()) ? null : new Date(d.getFullYear(), d.getMonth(), d.getDate());
}

function today(){ return new Date().toISOString().slice(0,10); }

function num(v){
  if(typeof v==='number') return isNaN(v)?0:v;
  let s=String(v||'').replace(/[^0-9,.-]/g,'');
  if(!s) return 0;
  const c=s.lastIndexOf(','), d=s.lastIndexOf('.');
  if(c!==-1 && d!==-1){
    if(c>d) s=s.replace(/\./g,'').replace(',','.');
    else s=s.replace(/,/g,'');
  } else if(c!==-1){
    const p=s.split(',');
    if(p.length===2 && p[1].length<=2) s=p[0].replace(/\./g,'')+'.'+p[1];
    else s=s.replace(/,/g,'');
  } else if(d!==-1){
    const p=s.split('.');
    if(p.length>2) s=s.replace(/\./g,'');
  }
  return Number(s)||0;
}

function rupiah(v){
  return new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(num(v));
}
function clean(v){ return String(v||'').toUpperCase().replace(/[^A-Z0-9]/g,''); }
function esc(s){ return String(s ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); }
function escAttr(s){ return esc(s).replace(/`/g,'&#96;'); }

function financeMonthNames(){ return ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember']; }
function dateKeyLocal(d){
  const x = d instanceof Date ? d : new Date(d);
  if(isNaN(x.getTime())) return '';
  return x.getFullYear() + '-' + String(x.getMonth()+1).padStart(2,'0') + '-' + String(x.getDate()).padStart(2,'0');
}
function currentMonthRange(){
  const now = new Date();
  const start = new Date(now.getFullYear(), now.getMonth(), 1);
  const end = new Date(now.getFullYear(), now.getMonth()+1, 0);
  return { dateStart: dateKeyLocal(start), dateEnd: dateKeyLocal(end), period: now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') };
}
function normalizeDateInput(v){
  const s = String(v || '').trim();
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  const d = new Date(s);
  return isNaN(d.getTime()) ? '' : dateKeyLocal(d);
}
function getActiveReportRange(){
  if(!state.reportStart || !state.reportEnd){
    const r = currentMonthRange();
    state.reportStart = r.dateStart;
    state.reportEnd = r.dateEnd;
    state.periodKey = r.period;
  }
  if(state.reportStart > state.reportEnd){ const t = state.reportStart; state.reportStart = state.reportEnd; state.reportEnd = t; }
  state.periodKey = String(state.reportStart || '').slice(0,7) || currentMonthRange().period;
  return { dateStart: state.reportStart, dateEnd: state.reportEnd, period: state.periodKey };
}
function getActivePeriodKey(){ return getActiveReportRange().period; }
function getFinanceFilterPayload(){ return getActiveReportRange(); }
function isFullMonthRange(r){
  if(!r || !r.dateStart || !r.dateEnd) return false;
  const s = new Date(r.dateStart + 'T00:00:00');
  const e = new Date(r.dateEnd + 'T00:00:00');
  if(isNaN(s.getTime()) || isNaN(e.getTime())) return false;
  const first = new Date(s.getFullYear(), s.getMonth(), 1);
  const last = new Date(s.getFullYear(), s.getMonth()+1, 0);
  return dateKeyLocal(first) === r.dateStart && dateKeyLocal(last) === r.dateEnd;
}
function formatTanggalIndo(key){
  const m = String(key || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(!m) return key || '';
  return `${m[3]}/${m[2]}/${m[1]}`;
}
function periodLabel(){
  const r = getActiveReportRange();
  if(isFullMonthRange(r)){
    const m = String(r.dateStart).match(/^(\d{4})-(\d{2})/);
    return m ? (financeMonthNames()[Number(m[2])-1] + ' ' + m[1]) : `${formatTanggalIndo(r.dateStart)} - ${formatTanggalIndo(r.dateEnd)}`;
  }
  return `${formatTanggalIndo(r.dateStart)} - ${formatTanggalIndo(r.dateEnd)}`;
}
function initPeriodFilter(){
  const r = currentMonthRange();
  state.reportStart = state.reportStart || r.dateStart;
  state.reportEnd = state.reportEnd || r.dateEnd;
  state.periodKey = state.periodKey || r.period;
  setPeriodControlsFromRange(getActiveReportRange());
  syncPeriodUiLabel();
}
function setPeriodControlsFromRange(r){
  const awal = document.getElementById('filterTanggalAwal');
  const akhir = document.getElementById('filterTanggalAkhir');
  if(awal) awal.value = r.dateStart || '';
  if(akhir) akhir.value = r.dateEnd || '';
}
function readPeriodControls(){
  const fallback = currentMonthRange();
  const awal = normalizeDateInput(document.getElementById('filterTanggalAwal')?.value) || fallback.dateStart;
  const akhir = normalizeDateInput(document.getElementById('filterTanggalAkhir')?.value) || fallback.dateEnd;
  return awal <= akhir ? { dateStart: awal, dateEnd: akhir, period: awal.slice(0,7) } : { dateStart: akhir, dateEnd: awal, period: akhir.slice(0,7) };
}
function syncPeriodUiLabel(){
  const label = periodLabel();
  document.querySelectorAll('[data-fin-period-label]').forEach(el => el.textContent = label);
}
function applyReportPeriod(){
  const next = readPeriodControls();
  const current = getActiveReportRange();
  if(next.dateStart === current.dateStart && next.dateEnd === current.dateEnd){ toast('Periode sudah aktif: ' + periodLabel(), 'info'); return; }
  state.reportStart = next.dateStart;
  state.reportEnd = next.dateEnd;
  state.periodKey = next.period;
  state.heavyLoaded = false;
  state.renderedTabs = {};
  state.bankStatementLoaded = false;
  state.bankStatement = null;
  state.data = Object.assign({}, state.data || {}, { cogmCogs: { deferred:true, periodKey:next.period, dateStart:next.dateStart, dateEnd:next.dateEnd }, labaRugi: {}, neraca: {} });
  refreshAll({ silent:false, source:'date_range_filter', lite:true });
}
function resetReportPeriod(){
  const r = currentMonthRange();
  state.reportStart = r.dateStart; state.reportEnd = r.dateEnd; state.periodKey = r.period;
  setPeriodControlsFromRange(r);
  state.heavyLoaded = false; state.renderedTabs = {};
  state.bankStatementLoaded = false;
  state.bankStatement = null;
  refreshAll({ silent:false, source:'period_reset', lite:true });
}

  tab = normalizeFinanceTab(tab || state.activeTab || 'dashboard');
  if((tab === 'labarugi' || tab === 'neraca' || tab === 'cogm') && !state.heavyLoaded){
    toast('Memuat data lengkap sebelum cetak...', 'info');
    ensureFinanceTabData(tab);
    setTimeout(()=>printFinanceReport(tab), 1800);
    return;
  }
  const title = reportTitleForTab(tab);
  const period = periodLabel();
  const content = buildFinancialPrintContent(tab);
  if(!content){ toast('Area laporan tidak ditemukan.', 'error'); return; }
  const companyName = (state.bootstrap?.company?.name || state.bootstrap?.companyName || 'CV KIRAL');
  const companyAddr = (state.bootstrap?.company?.address || state.bootstrap?.companyAddress || '');
  const html = `<!doctype html><html><head><meta charset="utf-8"><title>${esc(title)} ${esc(period)}</title><style>
    @page{size:A4;margin:14mm 13mm}body{font-family:Arial,Helvetica,sans-serif;color:#111;font-size:11.5px}.kop{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #111;padding-bottom:9px;margin-bottom:12px}.company{font-size:18px;font-weight:800;letter-spacing:.2px}.addr{font-size:10.5px;color:#555;margin-top:3px}.report-title{text-align:right;font-size:16px;font-weight:800}.period{text-align:right;font-size:12px;font-weight:700;margin-top:3px}.report-table{width:100%;border-collapse:collapse}.report-table td{padding:3.8px 2px;vertical-align:top}.report-table .section td{font-weight:800;text-transform:uppercase;padding-top:10px;padding-bottom:4px}.report-table .bold td{font-weight:800;border-top:1.4px solid #111}.report-table .spacer td{height:7px}.rp{width:28px;text-align:center}.num{width:150px;text-align:right}.small-note{font-size:10px;color:#666;margin-top:10px}.generic-print .btn,.generic-print .badge,.generic-print .alert,.generic-print .small.text-muted,.generic-print .text-muted{display:none!important}.generic-print .card{box-shadow:none!important;border:0!important}.print-footer{margin-top:22px;border-top:1px solid #999;padding-top:7px;font-size:9.5px;color:#666;display:flex;justify-content:space-between}
    </style></head><body><div class="kop"><div><div class="company">${esc(companyName)}</div>${companyAddr?`<div class="addr">${esc(companyAddr)}</div>`:''}</div><div><div class="report-title">${esc(title)}</div><div class="period">${esc(period)}</div></div></div>${content}<div class="print-footer"><span>ERP Finance CV Kiral</span><span>Dicetak ${new Date().toLocaleString('id-ID')}</span></div><script>window.onload=function(){setTimeout(function(){window.print();},300)}<\/script></body></html>`;
  const w = window.open('', '_blank');
  if(!w){ toast('Popup print diblokir browser.', 'warning'); return; }
  w.document.open(); w.document.write(html); w.document.close();
}
function ensureFinanceTabData(tab){
  tab = normalizeFinanceTab(tab);
  if(tab !== 'neraca' && tab !== 'cogm' && tab !== 'labarugi') return;
  if(state.heavyLoaded || __financeLoading) return;
  __financeLoading = true;
  showStatus(tab === 'labarugi' ? 'Memuat Laba/Rugi lengkap periode ' + periodLabel() + '...' : 'Memuat COGM/COGS & valuasi stok periode ' + periodLabel() + '...', false);
  runGasFinance('FIN_getFinanceHeavyData', [getFinanceFilterPayload()], res => {
    __financeLoading = false;
    state.data = Object.assign({}, state.data || {}, res || {});
    state.heavyLoaded = !!(res && res.heavyLoaded);
    renderActiveTab();
    showStatus('');
    renderSourceWarnings();
  }, err => {
    __financeLoading = false;
    showStatus((err && err.message) || String(err), true);
  });
}

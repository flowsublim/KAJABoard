<style>
:root{--bg:#eef3f8;--card:#fff;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--blue:#1677ff;--red:#ef4444;--shadow:0 16px 36px rgba(15,23,42,.09)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:linear-gradient(135deg,#eef3f8,#f8fafc);color:var(--ink)}
.portal-wrap{max-width:1180px;margin:0 auto;padding:28px 18px 48px}.topbar{background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:22px 24px;display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:22px}.brand{display:flex;align-items:center;gap:16px}.logo{width:58px;height:58px;border-radius:18px;background:#111827;color:#facc15;display:grid;place-items:center;font-weight:1000;font-size:21px;box-shadow:0 12px 24px rgba(15,23,42,.16)}h1{margin:0;color:var(--blue);font-size:32px;letter-spacing:-.9px}.logout{width:48px;height:48px;border:0;border-radius:16px;background:var(--red);color:#fff;font-size:22px;font-weight:1000;box-shadow:0 12px 22px rgba(239,68,68,.2);cursor:pointer}.module-panel{background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:24px}.module-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.module-card{border:1px solid var(--line);border-radius:22px;background:#fff;padding:22px;min-height:170px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;transition:.16s ease;position:relative;overflow:hidden}.module-card:before{content:'';position:absolute;inset:0 0 auto 0;height:5px;background:var(--moduleColor,#1677ff)}.module-card:hover{transform:translateY(-3px);box-shadow:0 16px 32px rgba(15,23,42,.13);border-color:#bfdbfe}.module-icon{width:52px;height:52px;border-radius:17px;background:var(--moduleTint,#eff6ff);display:grid;place-items:center;font-size:26px;margin-bottom:14px}.module-card h3{font-size:21px;margin:0}.open-link{align-self:flex-start;margin-top:18px;border:0;border-radius:14px;background:var(--moduleColor,#1677ff);color:white;font-weight:900;padding:11px 18px;cursor:pointer}.empty{padding:30px;text-align:center;border:1px dashed var(--line);border-radius:16px;color:var(--muted);font-weight:700}.hide{display:none!important}.overlay{position:fixed;inset:0;background:rgba(15,23,42,.5);backdrop-filter:blur(7px);display:grid;place-items:center;padding:18px;z-index:999}.login-card{width:min(470px,100%);background:#fff;border-radius:26px;box-shadow:0 28px 70px rgba(15,23,42,.28);padding:34px;text-align:center}.login-icon{width:72px;height:72px;margin:0 auto 18px;border-radius:22px;background:#111827;color:#facc15;display:grid;place-items:center;font-weight:1000;font-size:22px}.login-card h2{margin:0 0 8px;font-size:28px;color:var(--ink)}.login-card p{margin:0;color:var(--muted);line-height:1.5}.email-badge{background:#eff6ff;color:#1d4ed8;border-radius:999px;display:inline-block;padding:9px 14px;font-weight:900;margin:18px 0}.btn-primary,.btn-light{border:0;border-radius:14px;padding:13px 20px;font-weight:900;cursor:pointer}.btn-primary{background:var(--blue);color:white;box-shadow:0 10px 20px rgba(22,119,255,.18)}.btn-primary:disabled{opacity:.7;cursor:wait}.btn-light{background:#e2e8f0;color:#334155}.login-actions{display:flex;gap:10px;justify-content:center;margin-top:18px}.forbidden .login-icon{background:#fee2e2;color:#dc2626}.spinner{width:19px;height:19px;border:3px solid rgba(255,255,255,.45);border-top-color:#fff;border-radius:999px;display:inline-block;vertical-align:-4px;margin-right:8px;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.toast{position:fixed;right:18px;bottom:18px;z-index:1000;display:grid;gap:8px}.toast-item{background:#0f172a;color:white;border-radius:14px;padding:12px 14px;font-weight:800;box-shadow:0 12px 28px rgba(15,23,42,.25)}.toast-item.error{background:#dc2626}.toast-item.success{background:#16a34a}@media(max-width:860px){.module-grid{grid-template-columns:repeat(2,minmax(0,1fr))}h1{font-size:25px}}@media(max-width:560px){.module-grid{grid-template-columns:1fr}.topbar{padding:18px}.logo{width:50px;height:50px}.module-panel{padding:18px}.logout{width:46px;height:46px}}
</style>

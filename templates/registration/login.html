{% load static %}
<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Masuk · KAJABoard</title>
  <link rel="stylesheet" href="{% static 'css/kajaboard.css' %}">
</head>
<body class="login-page">
  <main class="login-card">
    <div class="brand login-brand"><span class="brand-mark">K</span><span><strong>KAJABoard</strong><small>PT KAJA VASTRALOKA KREASINDO</small></span></div>
    <h1>Masuk</h1>
    <p class="muted">Gunakan akun internal KAJABoard Anda.</p>
    {% if form.errors %}<div class="alert alert-error">Email atau kata sandi tidak valid.</div>{% endif %}
    <form method="post" class="stacked-form">
      {% csrf_token %}
      <label for="id_username">Email</label>
      {{ form.username }}
      <label for="id_password">Kata sandi</label>
      {{ form.password }}
      {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
      <button class="button button-primary" type="submit">Masuk</button>
    </form>
  </main>
</body>
</html>

{% extends "base.html" %}{% block content %}
<div class="page-header">
  <div>
    <p class="eyebrow">{{ project.code }}</p>
    <h1>{{ title }}</h1>
  </div>
</div>
<form method="post" class="panel form-panel">
  {% csrf_token %}
  {{ form.as_p }}
  <div class="form-actions">
    <button class="button button-primary" type="submit">Save forecast line</button>
    <a class="button" href="{% url 'projects:detail' project.pk %}">Cancel</a>
  </div>
</form>
{% endblock %}

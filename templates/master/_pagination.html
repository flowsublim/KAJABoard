{% if page.paginator.num_pages > 1 %}<nav class="pagination" aria-label="Pagination">
  {% if page.has_previous %}<a href="?page={{ page.previous_page_number }}&q={{ search|urlencode }}{% if include_inactive %}&inactive=1{% endif %}">Previous</a>{% endif %}
  <span>Page {{ page.number }} of {{ page.paginator.num_pages }}</span>
  {% if page.has_next %}<a href="?page={{ page.next_page_number }}&q={{ search|urlencode }}{% if include_inactive %}&inactive=1{% endif %}">Next</a>{% endif %}
</nav>{% endif %}

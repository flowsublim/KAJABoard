{% extends "base.html" %}
{% block title %}{{ title }} · KAJABoard{% endblock %}
{% block content %}
<div class="page-header"><div><p class="eyebrow">Organization master</p><h1>{{ title }}</h1><p class="muted">Changes are validated by the application service and recorded in the audit trail.</p></div></div>

{% endblock %}

{% load static %}
<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}KAJABoard{% endblock %}</title><link rel="stylesheet" href="{% static 'css/kajaboard.css' %}"><script src="{% static 'js/kajaboard.js' %}" defer></script></head>
<body><div class="app-shell"><aside class="sidebar" id="sidebar"><a class="brand" href="{% url 'home:home' %}"><span class="brand-mark">K</span><span><strong>KAJABoard</strong><small>Business management</small></span></a>{% include "core/_sidebar.html" %}</aside><div class="app-main"><header class="topbar"><button class="sidebar-toggle" type="button" aria-controls="sidebar" aria-expanded="false" data-sidebar-toggle>Menu</button><a class="mobile-brand" href="{% url 'home:home' %}">KAJABoard</a><span class="topbar-context">KAJABoard</span><div class="user-menu"><span>{{ request.user.email }}</span><form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="link-button" type="submit">Keluar</button></form></div></header><main class="content" id="main-content">{% block content %}{% endblock %}</main></div></div>
{% include "core/_modal_shell.html" %}{% include "core/_toast_container.html" %}</body></html>
